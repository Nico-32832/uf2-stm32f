name: Build UF2 Bootloader
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ARM Toolchain & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make python3 wget
      - name: Install GNU Make 4.2.1 for Legacy libopencm3
        run: |
          wget -q https://gnu.org
          tar -xzf make-4.2.1.tar.gz
          cd make-4.2.1 && ./configure --prefix=/usr/local && make -j4 && sudo make install
      - name: Build f412 Bootloader
        run: /usr/local/bin/make BOARD=f412 CPUTYPE=STM32F412 SHELL=/bin/bash
      - name: Upload Built Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uf2-f412-build
          path: build/
