name: Build UF2 Bootloader
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Install Base Tools
        run: |
          apt-get update
          apt-get install -y git make python3 python-is-python3 curl xz-utils ca-certificates
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup ARM GCC Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: 10.3-2021.10
      - name: Build libopencm3 (STM32F4 only)
        run: make -C libopencm3 TARGETS=stm32/f4 -j4 SHELL=/bin/bash
      - name: Build f412 Bootloader
        run: make BOARD=f412 CPUTYPE=STM32F412 SHELL=/bin/bash
      - name: Upload Built Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uf2-f412-build
          path: build/
